name: Docker Image GHCR

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        run: |
          echo "IMAGE_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_LOWER }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_LOWER }}:${{ github.sha }}

      - name: Show image digest
        run: |
          echo "Imagem publicada no GHCR."
          echo "Para rodar quando tiver Docker:"
          echo "docker run -p 8501:8501 -e GEMINI_API_KEY=SEU_KEY ${{ env.REGISTRY }}/${{ env.IMAGE_LOWER }}:latest"
#
# disparo manual: Actions > docker-image.yml > Run workflow
