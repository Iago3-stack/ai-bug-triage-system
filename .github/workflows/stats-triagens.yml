name: Estatísticas de Triagens (stats.json)

on:
  schedule:
    - cron: '12 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stats-pages
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Baixar código da landing
        uses: actions/checkout@v7

      # Só publica quando der tudo certo — se faltar badge vivo, chave ou a
      # consulta falhar, o job termina sem deploy e o site continua o que era.
      - name: Gerar stats.json (contagem real de triagens do Supabase)
        run: |
          set -e
          if ! curl -sf "https://ai-bug-triage.com.br/pytest-badge.json" -o badge.json; then
            echo "Badge vivo indisponível — mantendo deploy atual."
            exit 0
          fi
          python3 - <<'PY'
          import datetime
          import json
          import os
          import urllib.request
          import zoneinfo

          url = os.environ.get("SUPABASE_URL", "").rstrip("/")
          key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY", "")
          if not url or not key:
              raise SystemExit("Secret SUPABASE_URL/SERVICE_ROLE ausente")

          hoje = datetime.datetime.now(
              zoneinfo.ZoneInfo("America/Fortaleza")
          ).strftime("%Y-%m-%d")

          def paginar():
              """Traz todos os payloads (paginado) para calcular métricas reais."""
              linhas, inicio = [], 0
              while True:
                  req = urllib.request.Request(
                      f"{url}/rest/v1/triagens?select=payload&order=data_hora.asc",
                      headers={
                          "apikey": key,
                          "Authorization": f"Bearer {key}",
                          "Range": f"{inicio}-{inicio + 199}",
                      },
                  )
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = json.loads(r.read().decode())
                  linhas.extend(data)
                  if len(data) < 200:
                      break
                  inicio += 200
              return linhas

          linhas = paginar()
          n = len(linhas)
          com_ia = sum(1 for l in linhas if (l.get("payload") or {}).get("usou_ia"))
          critica = sum(
              1
              for l in linhas
              if str((l.get("payload") or {}).get("gravidade") or "").startswith("CRÍTICA")
          )
          duracao = [
              int(d)
              for d in ((l.get("payload") or {}).get("duracao_ms") for l in linhas)
              if isinstance(d, (int, float))
          ]
          stats = {
              "total": n,
              "hoje": sum(1 for l in linhas if (l.get("payload") or {}).get("data") == hoje),
              "com_ia": com_ia,
              "critica": critica,
              "tempo_medio_ms": round(sum(duracao) / len(duracao)) if duracao else None,
              "atualizado_em": datetime.datetime.now(
                  zoneinfo.ZoneInfo("America/Fortaleza")
              ).isoformat(timespec="minutes"),
          }
          with open("stats.json", "w", encoding="utf-8") as f:
              json.dump(stats, f, ensure_ascii=False)
          print(f"stats: total={stats['total']} com_ia={stats['com_ia']} "
                f"critica={stats['critica']} tempo={stats['tempo_medio_ms']}")
          PY

      - name: Montar site (landing + badge vivo + stats.json)
        run: |
          mkdir -p badge
          cp -r web/landing/. badge/
          mv badge.json badge/pytest-badge.json
          mv stats.json badge/stats.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: badge

      - uses: actions/deploy-pages@v5