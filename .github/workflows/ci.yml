name: CI - Testes (pytest)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: badge-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências de produção
        run: pip install -r requirements.txt

      - name: Instalar dependências de teste
        run: pip install -r requirements-dev.txt

      - name: Auditoria de vulnerabilidades (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Rodar testes unitários
        run: pytest -v --junitxml=junit.xml

      # if: always() — o badge reflete o resultado REAL: se este job falhar,
      # ainda geramos o badge vermelho a partir do junit.xml. Assim a falha
      # não fica "escondida" num badge verde do último push bom.
      - name: Gerar badge JSON com a contagem real de testes
        if: always()
        run: |
          mkdir -p badge
          python3 - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          payload = {"schemaVersion": 1, "label": "Testes", "message": "erro no CI", "color": "E91E63"}
          if os.path.exists("junit.xml"):
              root = ET.parse("junit.xml").getroot()
              suite = root.find("testsuite") if root.tag == "testsuites" else root
              total = int(suite.get("tests", "0"))
              falhas = int(suite.get("failures", "0")) + int(suite.get("errors", "0")) + int(suite.get("skipped", "0"))
              aprovados = total - falhas
              payload = {
                  "schemaVersion": 1,
                  "label": "Testes",
                  "message": f"{aprovados} passed",
                  "color": "4CAF50" if falhas == 0 else "E91E63",
              }
          with open("badge/pytest-badge.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          print(f"Badge: {payload['message']}")
          PY

      - name: Publicar landing + badge como artefato de Pages
        if: always()
        run: |
          cp -r web/landing/. badge/
          ls -la badge
          echo "Landing + badge em https://ai-bug-triage.com.br/ (+ pytest-badge.json)"
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: badge

  badge:
    runs-on: ubuntu-latest
    needs: test
    # always(): deploy do badge acontece mesmo quando os testes falham
    # (badge atualiza para a cor real); só na branch main.
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy do badge para Pages
        uses: actions/deploy-pages@v4

#
# Este workflow roda automaticamente a cada push/PR na branch main.
# Fim: publica https://ai-bug-triage.com.br/ (landing, domínio próprio via CNAME)
# + pytest-badge.json, usado no badge dinâmico de testes (img.shields.io/endpoint)
# do README — o número de testes e a cor (verde/vermelho) atualizam sozinhos a
# cada push, sem editar README.