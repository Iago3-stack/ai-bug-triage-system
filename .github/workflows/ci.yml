name: CI - Testes (pytest)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: badge-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências de produção
        run: pip install -r requirements.txt

      - name: Instalar dependências de teste
        run: pip install -r requirements-dev.txt

      - name: Rodar testes unitários
        run: pytest -v --junitxml=junit.xml

      - name: Gerar badge JSON com a contagem real de testes
        run: |
          mkdir -p badge
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          root = ET.parse("junit.xml").getroot()
          suite = root.find("testsuite") if root.tag == "testsuites" else root
          total = int(suite.get("tests", "0"))
          falhas = int(suite.get("failures", "0")) + int(suite.get("errors", "0")) + int(suite.get("skipped", "0"))
          aprovados = total - falhas
          payload = {
              "schemaVersion": 1,
              "label": "Testes",
              "message": f"{aprovados} passed",
              "color": "4CAF50" if falhas == 0 else "E91E63",
          }
          with open("badge/pytest-badge.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          print(f"Badge gerado: {aprovados} passed (total={total}, falhas={falhas})")
          PY

      - name: Publicar badge como artefato de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: badge

  badge:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy do badge para Pages
        uses: actions/deploy-pages@v4

#
# Este workflow roda automaticamente a cada push/PR na branch main.
# Fim: publica https://iago3-stack.github.io/ai-bug-triage-system/pytest-badge.json
# usado no badge dinâmico de testes (img.shields.io/endpoint) do README e do perfil —
# o número de testes atualiza sozinho a cada push, sem editar README.