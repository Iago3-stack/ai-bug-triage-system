version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    # Os labels precisam existir no repo, senão o Dependabot comenta em TODO
    # PR reclamando ("The following labels could not be found") e nenhum label
    # é aplicado. O repo usa labels em inglês: `dependencies` já existe,
    # `security` foi criado junto com esta correção.
    labels:
      - dependencies
      - security
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5