<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
</head>
<body>
  <script type="text/javascript">
    (function () {
      var SET_COMPONENT_VALUE = "streamlit:setComponentValue";
      var RENDER = "streamlit:render";
      var SET_FRAME_HEIGHT = "streamlit:setFrameHeight";
      var COMPONENT_READY = "streamlit:componentReady";
      var KEY = "_auth_sessao_persist";
      var KEY_TS = "_auth_sessao_persist_ts";
      var KEY_COOKIE = "_auth_sessao_persist_rf";

      function sendMessage(type, data) {
        var out = Object.assign({ isStreamlitMessage: true, type: type }, data);
        window.parent.postMessage(out, "*");
      }
      function setFrameHeight(h) { sendMessage(SET_FRAME_HEIGHT, { height: h }); }
      // O valor do componente deve ir na chave "value" do topo do payload.
      function notifyHost(data) {
        window.parent.postMessage(
          { isStreamlitMessage: true, type: SET_COMPONENT_VALUE, value: data },
          "*"
        );
      }

      function ler() {
        try { return JSON.parse(localStorage.getItem(KEY) || "null"); }
        catch (e) { return null; }
      }
      function lerEnvelope() {
        // Envelope com a sessão + timestamp da última escrita: permite ao boot
        // distinguir "nunca gravou" de "gravou mas a leitura falhou".
        var ts = null;
        try { ts = parseInt(localStorage.getItem(KEY_TS) || "null", 10); } catch (e) {}
        return { sessao: ler(), ts: ts };
      }
      function setCookie(v) {
        try {
          // O iframe roda com allow-same-origin: document.cookie pertence à
          // ORIGEM DO APP (não à origem do iframe), então o cookie viaja para o
          // servidor em todo request e é lido pelo Python via st.context.cookies.
          // Só guardamos o refresh_token (curto) para caber no limite de ~4KB.
          var valor = (v && v.refresh_token) ? v.refresh_token : "";
          if (valor) {
            document.cookie = KEY_COOKIE + "=" + encodeURIComponent(valor) +
              "; path=/; SameSite=Lax; Secure";
          } else {
            document.cookie = KEY_COOKIE + "=; path=/; SameSite=Lax; Secure; Max-Age=0";
          }
        } catch (e) {}
      }
      function salvar(valor) {
        try {
          localStorage.setItem(KEY, JSON.stringify(valor));
          localStorage.setItem(KEY_TS, String(Date.now()));
        } catch (e) {}
        setCookie(valor);
      }
      function limpar() {
        try {
          localStorage.removeItem(KEY);
          localStorage.removeItem(KEY_TS);
        } catch (e) {}
        try { document.cookie = KEY_COOKIE + "=; path=/; Max-Age=0"; } catch (e) {}
      }
      function info() {
        try { return { ts: JSON.parse(localStorage.getItem(KEY_TS) || "null") }; }
        catch (e) { return { ts: null }; }
      }

      window.addEventListener("message", function (event) {
        if (!event.data || event.data.type !== RENDER) return;
        var args = event.data.args || {};
        var comando = args.comando || "ler";
        if (comando === "salvar" && args.valor !== undefined) {
          salvar(args.valor);
          notifyHost(lerEnvelope());
        } else if (comando === "limpar") {
          limpar();
          notifyHost(lerEnvelope());
        } else if (comando === "info" || comando === "ler") {
          notifyHost(lerEnvelope());
        }
        // "ocioso": mantém o iframe montado sem tocar em nada nem notificar o
        // host — a árvore do Streamlit fica estável e sem artefatos.
        setFrameHeight(1);
      });

      window.addEventListener("load", function () {
        sendMessage(COMPONENT_READY, { apiVersion: 1 });
        setFrameHeight(1);
      });
    })();
  </script>
</body>
</html>
