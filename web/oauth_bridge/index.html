<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 2px; }
    .oauth-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; padding: 12px 14px; margin: 6px 0;
      border: 1px solid #d1d5db; border-radius: 10px; cursor: pointer;
      font-size: 14px; font-weight: 600; color: #111827; background: #ffffff;
      transition: background .15s ease;
    }
    .oauth-btn:hover { background: #f3f4f6; }
    .oauth-btn img { width: 18px; height: 18px; }
    .oauth-msg { font-size: 12px; color: #6b7280; margin: 6px 0; text-align: center; min-height: 16px; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #9ca3af;
               border-top-color: transparent; border-radius: 50%; vertical-align: -2px; margin-right: 8px;
               animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ok { color: #059669; }
    .erro { color: #b91c1c; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/javascript">
    (function () {
      var SET_COMPONENT_VALUE = "streamlit:setComponentValue";
      var RENDER = "streamlit:render";
      var COMPONENT_READY = "streamlit:componentReady";
      var SET_FRAME_HEIGHT = "streamlit:setFrameHeight";
      var LS_KEY = "_sb_auth_oauth";
      var LS_CAPTURED = "_sb_oauth_capturado";

      function sendMessage(type, data) {
        var out = Object.assign({ isStreamlitMessage: true, type: type }, data);
        window.parent.postMessage(out, "*");
      }
      function setFrameHeight(h) { sendMessage(SET_FRAME_HEIGHT, { height: h }); }
      // O valor do componente deve ir na chave "value" do topo do payload;
      // do contrario o Streamlit ignora ("missing 'value' prop").
      function notifyHost(data) {
        window.parent.postMessage(
          { isStreamlitMessage: true, type: SET_COMPONENT_VALUE, value: data },
          "*"
        );
      }
      function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      // URL da aplicação (o iframe roda dentro dela; em aba normal é a própria).
      // Normaliza: remove a barra final para casar exatamente com as Redirect
      // URLs cadastradas no Supabase (ex.: https://app.streamlit.app).
      function appUrl() {
        var url = "";
        try {
          var top = window.top.location;
          if (top && top.origin) url = top.origin + top.pathname;
        } catch (e) {}
        if (!url) url = window.location.origin + window.location.pathname;
        return url.replace(/\/+$/, "");
      }

      // URL da "página de retorno" da OAuth (fim.html). O componente é servido
      // em um caminho estável (http://host/component/oauth_bridge.oauth_login/
      // index.html, sempre na mesma origin da app); colocamos fim.html ao lado.
      // O provider redireciona a POPUP para esta página: ela roda no NÍVEL TOPO
      // da popup (não sandboxed), grava o token no localStorage e chama
      // window.close(), que funciona em janela aberta por window.open. Dentro
      // do iframe do componente (sandboxed) o window.close() não fecha a popup.
      function fimUrl() {
        var base = window.location.href.split(/[?#]/)[0];
        base = base.replace(/\/index\.html(\/.*)?$/, "/index.html");
        return base.replace(/index\.html$/, "fim.html");
      }

      // Fragmento da URL DA APLICAÇÃO: na Cloud o app roda DENTRO de iframes
      // (shell -> streamlitApp -> componente). O Supabase devolve o token no
      // fragmento da URL da aba/iframe onde o app roda, que pode ser qualquer
      // nível da cadeia. Varre todos os frames do self até o topo.
      function hashDaApp() {
        var w = window;
        while (w) {
          try {
            if (w.location && w.location.hash) return w.location.hash;
          } catch (e) {}
          try {
            w = w !== window.top ? w.parent : null;
          } catch (e) { w = null; }
        }
        return "";
      }

      // Remove o fragmento do frame onde ele está (evita re-processar no reload).
      function limparHashTopo() {
        var w = window;
        while (w) {
          try {
            if (w.location && w.location.hash) {
              w.history.replaceState(null, "", w.location.origin + w.location.pathname + w.location.search);
            }
          } catch (e) {}
          try {
            w = w !== window.top ? w.parent : null;
          } catch (e) { w = null; }
        }
      }

      // Captura o token no fragmento e grava no localStorage (ponte). Dentro da
      // popup do OAuth o retorno do provider navega para esta app (mesma
      // origin) com #access_token; capturamos, fechamos a popup e a janela
      // PRINCIPAL (que mantém o poll ativo) lê o token do localStorage.
      // Na janela principal `emPopup`=false mantém o fluxo de captura+notify.
      // Detecção da popup em XX formas (nenhuma interfere na janela principal,
      // que nunca tem fragmento e portanto nunca usa estas funções para decisão
      // de poll):
      //   1) sentinela em localStorage escrita logo antes do window.open (mesma
      //      origin => visível na popup quando ela carrega a app com fragmento);
      //   2) window.open/opener (quando o navegador preservar o opener).
      function ehPopup() {
        try { if (localStorage.getItem("_sb_oauth_popup") === "1") return true; } catch (e) {}
        try { if (window.top && window.top.opener) return true; } catch (e) {}
        return false;
      }
      function fecharPopups() {
        try { window.top && window.top.close(); } catch (e) {}
        try { window.close(); } catch (e) {}
        try { localStorage.removeItem("_sb_oauth_popup"); } catch (e) {}
      }

      function capturarFragmento(emPopup) {
        var hash = hashDaApp();
        if (hash.length < 2) return false;
        // Já processado neste navegador (reload após captura): não re-notifica.
        // O fragmento já foi limpo, então aqui nunca entra no fluxo real;
        // apenas evita loop se algo reaparecer.
        try {
          if (window.sessionStorage.getItem(LS_CAPTURED) === "1") return false;
        } catch (e) {}
        var params = new URLSearchParams(hash.substring(1));
        // A URL do app é enviada junto na captura: no retorno do OAuth (full
        // reload) o Python chega sem _BASE; sem ela a etapa "aguardando" ecoa
        // para "fluxourl" e o login "reseta" — exatamente o que causava voltar
        // à tela de login após autenticar com sucesso.
        var urlApp = appUrl();
        if (params.get("error")) {
          var p_erro = { erro: params.get("error_description") || params.get("error") || "erro" };
          try {
            localStorage.setItem(LS_KEY, JSON.stringify(p_erro));
            window.sessionStorage.setItem(LS_CAPTURED, "1");
          } catch (e) {}
          limparHashTopo();
          if (emPopup) { fecharPopups(); return true; } // erro: grava e fecha
          notifyHost({ tipo: "captura", ok: false, erro: p_erro.erro, url: urlApp });
          return true;
        }
        var at = params.get("access_token");
        if (!at) return false;
        var payload = {
          access_token: at,
          refresh_token: params.get("refresh_token") || "",
          token_type: params.get("token_type") || "bearer",
          expires_in: params.get("expires_in") || "3600",
          provider_token: params.get("provider_token") || "",
          provider: params.get("provider") || "oauth"
        };
        try {
          localStorage.setItem(LS_KEY, JSON.stringify(payload));
          window.sessionStorage.setItem(LS_CAPTURED, "1");
        } catch (e) {}
        limparHashTopo();
        if (emPopup) { fecharPopups(); return true; } // sucesso: grava e fecha
        notifyHost({ tipo: "captura", ok: true, url: urlApp });
        return true;
      }

      // Le e devolve a sessao do localStorage (remove quando quer consumir).
      function lerSessao(remover) {
        try {
          var raw = localStorage.getItem(LS_KEY);
          if (!raw) return null;
          var s = JSON.parse(raw);
          if (remover) localStorage.removeItem(LS_KEY);
          return s;
        } catch (e) { return null; }
      }

      function desenharBotoes(args) {
        var root = document.getElementById("root");
        root.innerHTML = "";
        (args.providers || []).forEach(function (p) {
          if (!args.authorizeUrl || !args.authorizeUrl[p]) return;
          var cfg = args.authorizeUrl[p];
          var label = args.locale[p] || p;
          var btn = document.createElement("button");
          btn.className = "oauth-btn";
          btn.type = "button";
          var logos = {
            google: '<svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.35 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.75 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>',
            github: '<svg width="18" height="18" viewBox="0 0 16 16" fill="#24292f"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>'
          };
          btn.innerHTML = (logos[p] || "") + esc(label);
          btn.onclick = function () {
            // Abre o OAuth numa POPUP (janelinha, como no Supabase). A janela
            // principal mantém o poll de retorno e nunca sai da tela. Se o
            // navegador bloquear (window.open==null), avisamos a Python
            // {popup:false} para ela navegar a própria aba (fallback meta).
            var abriuPopup = false;
            try {
              try { localStorage.setItem("_sb_oauth_popup", "1"); } catch (e) {}
              // redirect_to fica = URL do app (allowlistada no Supabase): depois
              // do Google a POPUP volta para a app com #access_token, o componente
              // dentro dela captura o token para o localStorage (mesma origin) e a
              // janela PRINCIPAL, ao consumir, NAVEGA a popup até fim.html (fimUrl),
              // que roda no topo da popup e a fecha (window.close). O fim.html NÃO
              // precisa estar na allowlist do Supabase: ele só é usado como "close
              // page", nunca como redirect_to do provider.
              var pop = window.open(cfg.url, "oauth_login", "width=520,height=660,popup=yes,resizable=yes,scrollbars=yes");
              if (pop && !pop.closed) {
                abriuPopup = true;
                _popupRef = pop;
              } else {
                try { localStorage.removeItem("_sb_oauth_popup"); } catch (e) {}
              }
            } catch (e) { abriuPopup = false; }
            notifyHost({ tipo: "iniciado", provider: p, popup: abriuPopup });
          };
          root.appendChild(btn);
        });
        var m = document.createElement("div");
        m.className = "oauth-msg";
        m.id = "msg";
        m.innerHTML = args.locale.aviso || "";
        root.appendChild(m);
        setFrameHeight(170);
      }

      var _poll = null;
      var _popupRef = null;

      function pararPoll() { if (_poll) { clearInterval(_poll); _poll = null; } }

      function iniciarPoll(timeoutMs) {
        pararPoll();
        var inicio = Date.now();
        _poll = setInterval(function () {
          var s = lerSessao(true);
          if (s) {
            pararPoll();
            if (_popupRef && !_popupRef.closed) {
              // Navega a popup até a "close page" fim.html (mesma origin). Lá o
              // script roda no NÍVEL TOPO da popup (página aberta via window.open)
              // e o window.close() dela funciona — algo que NÃO acontece com o
              // close() chamado daqui (iframe sandboxed). O token já foi gravado
              // no localStorage pelo componente DENTRO da popup quando ela voltou
              // do Google com #access_token.
              try { _popupRef.location.href = fimUrl(); } catch (e) {}
              try { _popupRef.close(); } catch (e) {}
            }
            try { localStorage.removeItem("_sb_oauth_popup"); } catch (e) {}
            notifyHost({ tipo: "sessao", sessao: s });
          }
          else if (Date.now() - inicio > (timeoutMs || 120000)) {
            pararPoll();
            try { localStorage.removeItem("_sb_oauth_popup"); } catch (e) {}
            notifyHost({ tipo: "sessao", sessao: null });
          }
        }, 600);
      }

      window.addEventListener("message", function (event) {
        if (event.data.type !== RENDER) return;
        var args = event.data.args || {};
        var emPopup = ehPopup();

        if (capturarFragmento(emPopup)) return; // retorno OAuth: captura+notify (ou popup)

        var root = document.getElementById("root");

        if (args.aguardando) {
          // Janela PRINCIPAL: spinner + poll aguardando o token no localStorage.
          // Sempre inicia o poll aqui: a janela principal nunca tem fragmento
          // (capturarFragmento acima retorna false), então não há risco de a
          // popup "consumir" o token — quem captura é a popup, quem consome é
          // esta janela.
          root.innerHTML = "";
          var d = document.createElement("div");
          d.className = "oauth-msg";
          d.innerHTML = '<span class="spinner"></span>' + esc(args.locale.aguarde || "Aguardando autenticação…");
          root.appendChild(d);
          setFrameHeight(50);
          iniciarPoll(args.timeout_ms);
          return;
        }

        if (args.primeiro) {
          // 1o render: informa a Python a URL do app para montar o redirect_to.
          notifyHost({ tipo: "url", ok: true, url: appUrl() });
          return;
        }

        if (args.providers && args.providers.length) desenharBotoes(args);
      });

      sendMessage(COMPONENT_READY, { apiVersion: 1 });
      window.addEventListener("load", function () {
        window.setTimeout(function () { setFrameHeight(document.documentElement.clientHeight); }, 0);
      });
    })();
  </script>
</body>
</html>
