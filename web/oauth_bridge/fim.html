<html>
<head>
  <meta charset="utf-8" />
  <title>Autenticação concluída</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; text-align: center; color: #111827; }
    .ok { color: #059669; font-weight: 600; }
  </style>
</head>
<body>
  <div class="ok" id="msg">Autenticação concluída. Esta janela pode ser fechada.</div>
  <script type="text/javascript">
    // Página de RETORNO/fechamento do OAuth dentro da popup (nivel TOPO: aberta
    // via window.open). Duas formas de chegar aqui:
    //   a) "close page": a janela PRINCIPAL navega a popup para cá (redirect_to
    //      do provider = URL do app, que JÁ é allowlistada no Supabase; quem
    //      captura o token é o componente dentro da app que rodou na popup ao
    //      voltar do Google). Sem hash => só fecha; NÃO mexe no localStorage.
    //   b) "return page": se um dia o fim.html entrar na allowlist e for o
    //      redirect_to do provider, o token chega no fragmento e gravamos aqui
    //      (mesma origin => localStorage compartilhado com a janela principal).
    // window.close() FUNCIONA porque a popup foi aberta via window.open
    // (script-opened); dentro do componente sandboxed isso NAO funciona.
    (function () {
      var params = new URLSearchParams(window.location.hash.substring(1));
      if (params.get("access_token") || params.get("error")) {
        // Caso (b): temos token/erro no fragmento -> grava na ponte.
        var LS_KEY = "_sb_auth_oauth";
        function salvar(dados) {
          try { localStorage.setItem(LS_KEY, JSON.stringify(dados)); } catch (e) {}
        }
        if (params.get("error")) {
          salvar({ erro: params.get("error_description") || params.get("error") || "erro" });
        } else {
          var at = params.get("access_token");
          salvar({
            access_token: at,
            refresh_token: params.get("refresh_token") || "",
            token_type: params.get("token_type") || "bearer",
            expires_in: params.get("expires_in") || "3600",
            provider_token: params.get("provider_token") || "",
            provider: params.get("provider") || "oauth"
          });
          document.getElementById("msg").textContent = "Autenticação concluída. Esta janela pode ser fechada.";
        }
      }
      try { window.location.hash = ""; } catch (e) {}
      setTimeout(function () {
        try { window.close(); } catch (e) {}
      }, 100);
    })();
  </script>
</body>
</html>
