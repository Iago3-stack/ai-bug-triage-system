<html>
<head>
  <meta charset="utf-8" />
  <title>Autenticação concluída</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; text-align: center; color: #111827; }
    .ok { color: #059669; font-weight: 600; }
  </style>
</head>
<body>
  <div class="ok" id="msg">Autenticação concluída. Esta janela pode ser fechada.</div>
  <script type="text/javascript">
    // Página de RETORNO do OAuth dentro da popup (nivel TOPO: o provider
    // redireciona Cc popup para esta URL com o token no fragmento).
    // Grava o token no localStorage (mesma origin => compartilhado com a
    // janela principal, que mantem o poll de retorno) e fecha a popup.
    // window.close() FUNCIONA aqui porque a popup foi aberta via window.open
    // (script-opened); dentro do componente sandboxed isso NAO funciona.
    (function () {
      var LS_KEY = "_sb_auth_oauth";
      function salvar(dados) {
        try { localStorage.setItem(LS_KEY, JSON.stringify(dados)); } catch (e) {}
      }
      var params = new URLSearchParams(window.location.hash.substring(1));
      if (params.get("error")) {
        salvar({ erro: params.get("error_description") || params.get("error") || "erro" });
      } else {
        var at = params.get("access_token");
        if (at) {
          salvar({
            access_token: at,
            refresh_token: params.get("refresh_token") || "",
            token_type: params.get("token_type") || "bearer",
            expires_in: params.get("expires_in") || "3600",
            provider_token: params.get("provider_token") || "",
            provider: params.get("provider") || "oauth"
          });
          document.getElementById("msg").textContent = "Autenticação concluída. Esta janela pode ser fechada.";
        } else {
          salvar({ erro: "sem token" });
        }
      }
      try { window.location.hash = ""; } catch (e) {}
      setTimeout(function () {
        try { window.close(); } catch (e) {}
      }, 100);
    })();
  </script>
</body>
</html>
