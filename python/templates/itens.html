{% extends 'base.html' %}

{% block content %}
    <h2>Itens Cadastrados</h2>
    <p>Lista de produtos disponíveis:</p>

    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Valor</th>
                <th>Descrição</th>
            </tr>
        </thead>
        <tbody>
            {% for item in itens %}
                <tr>
                    <td>{{ item.id }}</td>
                    <td>{{ item.nome }}</td>
                    <td>R$ {{ "{:,.2f}".format(item.valor) }}</td>
                    <td>{{ item.descricao }}</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
